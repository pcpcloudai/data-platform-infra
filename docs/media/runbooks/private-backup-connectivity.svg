<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Private AWS-to-Azure backup connectivity</title>
  <desc id="description">AWS-owned backup resources connect through two IPsec tunnels to Azure-owned VPN, DNS, and Blob private endpoint resources.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker>
    <style>
      .title{font:700 24px Arial;fill:#0f172a}.label{font:600 16px Arial;fill:#0f172a}.small{font:14px Arial;fill:#334155}
      .aws{fill:#fff7ed;stroke:#f97316;stroke-width:2}.azure{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.private{fill:#ecfdf5;stroke:#059669;stroke-width:2}
      .boundary{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 6}.flow{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
      .dns{fill:none;stroke:#7c3aed;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="title">Private AWS-to-Azure backup path</text>
  <rect x="30" y="65" width="390" height="420" rx="18" class="boundary"/><text x="55" y="98" class="label">AWS — owned by backup team</text>
  <rect x="780" y="65" width="390" height="420" rx="18" class="boundary"/><text x="805" y="98" class="label">Azure — managed by this repository</text>
  <rect x="75" y="145" width="290" height="75" rx="12" class="aws"/><text x="220" y="178" text-anchor="middle" class="label">Backup Lambda</text><text x="220" y="201" text-anchor="middle" class="small">Private subnet CIDRs only</text>
  <rect x="75" y="290" width="290" height="75" rx="12" class="aws"/><text x="220" y="322" text-anchor="middle" class="label">AWS Virtual Private Gateway</text><text x="220" y="345" text-anchor="middle" class="small">Two redundant IPsec/BGP tunnels</text>
  <rect x="475" y="255" width="250" height="105" rx="12" class="azure"/><text x="600" y="290" text-anchor="middle" class="label">Azure VPN Gateway</text><text x="600" y="315" text-anchor="middle" class="small">GatewaySubnet · VpnGw2AZ</text><text x="600" y="338" text-anchor="middle" class="small">Two Azure connections</text>
  <rect x="825" y="145" width="290" height="75" rx="12" class="azure"/><text x="970" y="178" text-anchor="middle" class="label">DNS Private Resolver</text><text x="970" y="201" text-anchor="middle" class="small">Inbound endpoint</text>
  <rect x="825" y="290" width="290" height="75" rx="12" class="private"/><text x="970" y="322" text-anchor="middle" class="label">Blob Private Endpoint</text><text x="970" y="345" text-anchor="middle" class="small">TCP 443 from approved AWS CIDRs</text>
  <rect x="825" y="400" width="290" height="55" rx="12" class="private"/><text x="970" y="434" text-anchor="middle" class="label">Private Storage Account</text>
  <path d="M220 220 L220 290" class="flow"/><path d="M365 327 L475 307" class="flow"/><path d="M725 307 L825 327" class="flow"/><path d="M970 365 L970 400" class="flow"/>
  <path d="M365 175 C560 105 700 105 825 175" class="dns"/><text x="600" y="125" text-anchor="middle" class="small">Private DNS forwarding</text>
  <text x="600" y="470" text-anchor="middle" class="small">No public Blob fallback · no default route · TLS remains enabled</text>
</svg>
